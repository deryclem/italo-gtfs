name: Refresh OSM Tracks

on:
  schedule:
    - cron: "0 2 1 * *"  # On the 1st of every month at 02:00 UTC
  workflow_dispatch:       # Allows manual trigger anytime

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Cache pfaedle binary
        id: cache-pfaedle
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/pfaedle
          key: pfaedle-bin-v1

      - name: Install pfaedle
        if: steps.cache-pfaedle.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libzip-dev zlib1g-dev libbz2-dev
          git clone --recurse-submodules https://github.com/ad-freiburg/pfaedle.git /tmp/pfaedle
          cd /tmp/pfaedle
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install

      - name: Refresh OSM network data
        run: python3 scripts/refresh_osm.py

      - name: Commit updated OSM data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/italo-network.osm.pbf
          git diff --cached --quiet || git commit -m "chore: refresh OSM network $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
