name: Generate GTFS

on:
  schedule:
    - cron: "0 4 * * 1"  # Every Monday at 04:00 UTC
  workflow_dispatch:       # Also allows manual trigger from the GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Cache pfaedle binary
        id: cache-pfaedle
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/pfaedle
          key: pfaedle-bin-v1

      - name: Install pfaedle
        if: steps.cache-pfaedle.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libzip-dev zlib1g-dev libbz2-dev
          git clone --recurse-submodules https://github.com/ad-freiburg/pfaedle.git /tmp/pfaedle
          cd /tmp/pfaedle
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install

      - name: Cache gtfstidy binary
        id: cache-gtfstidy
        uses: actions/cache@v4
        with:
          path: ~/go/bin/gtfstidy
          key: gtfstidy-bin-v1

      - name: Set up Go
        if: steps.cache-gtfstidy.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install gtfstidy
        if: steps.cache-gtfstidy.outputs.cache-hit != 'true'
        run: go install github.com/patrickbr/gtfstidy@latest

      - name: Set up badger
        working-directory: vendor/badger
        run: |
          uv venv --python 3.12
          uv sync
          sh scripts/generate-schema.sh

      - name: Generate GTFS feed
        run: uv run --python 3.12 --with-requirements requirements.txt python3 generate.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gtfs-italo.zip .last_publication_timestamp
          git diff --cached --quiet || git commit -m "chore: update GTFS feed $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
